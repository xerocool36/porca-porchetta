<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pagina non trovata — Porca Porchetta</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#17110F">
<link rel="icon" href="assets/img/favicon-32.png" sizes="32x32">
<!-- Deliberately self-contained: this page is served for unknown URLs, where a
     stylesheet path may not resolve. Inlining the few rules it needs means it
     always renders, on a root domain or under a project subpath. -->
<style>
  @font-face{font-family:'Titan One';font-style:normal;font-weight:400;font-display:swap;
    src:url('assets/fonts/titanone-latin.woff2') format('woff2')}
  @font-face{font-family:'Archivo';font-style:normal;font-weight:400 800;font-display:swap;
    src:url('assets/fonts/archivo-latin.woff2') format('woff2')}
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;min-height:100svh;display:grid;place-items:center;text-align:center;
    background:#17110F;color:#EFE7DA;font-family:'Archivo',system-ui,sans-serif;
    font-size:1.0625rem;line-height:1.6;padding:32px 20px}
  img{display:block;max-width:100%;height:auto}
  h1{font-family:'Titan One','Archivo',sans-serif;font-weight:400;text-transform:uppercase;
    line-height:.9;margin:0 0 18px;font-size:clamp(2.4rem,13vw,5rem);
    color:#E07A55;text-shadow:5px 5px 0 #4A2A24}
  p{margin:0 auto 26px;max-width:34ch}
  .acts{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
  .btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;
    padding:13px 22px;border:3px solid #4A2A24;border-radius:999px;
    box-shadow:5px 5px 0 #4A2A24;font-weight:800;font-size:.97rem;letter-spacing:.045em;
    text-transform:uppercase;text-decoration:none;transition:transform .14s ease,box-shadow .14s ease}
  .btn:hover{transform:translate(2px,2px);box-shadow:3px 3px 0 #4A2A24}
  .btn--a{background:#F2542D;color:#fff}
  .btn--b{background:#EFCABC;color:#4A2A24}
  a:focus-visible{outline:4px solid #FFE9A3;outline-offset:3px}
</style>
</head>
<body>
  <main>
    <img src="assets/img/logo.png" alt="Porca Porchetta" width="120" height="120" style="margin:0 auto 18px">
    <h1>Porca<br>paletta</h1>
    <p>Questa pagina non c’è. Il tagliere però sì.</p>
    <div class="acts">
      <a class="btn btn--a" href="index.html">Torna alla home</a>
      <a class="btn btn--b" href="menu.html">Vedi il menù</a>
    </div>
  </main>
</body>
</html>
