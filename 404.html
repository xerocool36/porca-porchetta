<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pagina non trovata, Porca Porchetta</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F4EEE2">

<!-- GitHub Pages serves this file for unknown URLs *at any depth* under
     /porca-porchetta/, so a document-relative href resolves against the broken
     path, not against the site root: on /porca-porchetta/qualcosa/rotto/ the
     stylesheet, the font, the logo and both escape links all 404 in turn.
     One <base> fixes every one of them. It is also the single line to change
     if the site ever moves to its own domain at the root.

     This page used to solve that by inlining its own <style> block instead.
     That is worse, not better: netlify.toml ships style-src 'self' with no
     'unsafe-inline', so the whole block is dropped and the page renders naked
     anyway. -->
<base href="/porca-porchetta/">

<link rel="icon" href="assets/img/favicon-32.png" sizes="32x32">
<link rel="preload" href="assets/fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/bevan-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="e404">
  <div class="e404__box">
    <img class="e404__logo" src="assets/img/logo-128.webp" alt="" width="128" height="128" decoding="async">
    <p class="e404__n">Errore 404</p>
    <h1 class="e404__t">Questa pagina non esiste</h1>
    <p class="e404__lede">Il menù e la prenotazione restano raggiungibili. Torna alla home oppure vai direttamente al menù.</p>
    <div class="cta-row">
      <a class="btn btn--vino" href="./">Torna alla home</a>
      <a class="btn btn--linea" href="menu.html">Menù</a>
    </div>
  </div>
</body>
</html>
