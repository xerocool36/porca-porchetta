<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pagina non trovata, Porca Porchetta</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F2F2F0">
<link rel="icon" href="assets/img/favicon-32.png" sizes="32x32">

<!-- Deliberately self contained. GitHub Pages serves this file for unknown
     URLs at any depth under /porca-porchetta/, where even a relative path to
     css/style.css may not resolve. So the font and the handful of rules this
     page needs are inlined and it depends on nothing. Keep it that way. -->
<style>
  @font-face {
    font-family: 'Geist';
    src: url('assets/fonts/geist-latin.woff2') format('woff2');
    font-weight: 100 900; font-style: normal; font-display: swap;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100svh;
    display: grid;
    place-items: center;
    padding: 48px 22px;
    background: #F2F2F0;
    color: #2E2C29;
    font-family: 'Geist', system-ui, -apple-system, sans-serif;
    font-size: 17px;
    line-height: 1.65;
    letter-spacing: -0.004em;
    -webkit-font-smoothing: antialiased;
  }
  .box { max-width: 34rem; }
  img { display: block; width: 62px; height: 62px; margin: 0 0 34px; }
  .rule { width: 56px; height: 2px; background: #C0392B; border: 0; margin: 0 0 26px; }
  .n {
    font-size: .78rem;
    font-weight: 500;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: #6E6A63;
    margin: 0 0 14px;
  }
  h1 {
    font-weight: 500;
    font-size: clamp(1.9rem, 6vw, 2.9rem);
    line-height: 1.05;
    letter-spacing: -0.02em;
    margin: 0 0 14px;
  }
  p.lede { margin: 0 0 34px; color: #4A4742; max-width: 44ch; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; }
  a {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 52px;
    padding: 14px 28px;
    border: 1px solid transparent;
    border-radius: 2px;
    font-size: .95rem;
    font-weight: 500;
    text-decoration: none;
    color: #FFFFFF;
    transition: background-color .28s cubic-bezier(.16,1,.3,1),
                border-color .28s cubic-bezier(.16,1,.3,1),
                color .28s cubic-bezier(.16,1,.3,1);
  }
  .a-rosso { background: #C0392B; border-color: #C0392B; }
  .a-rosso:hover { background: #A2301F; border-color: #A2301F; }
  .a-line { border-color: #6E6A63; color: #2E2C29; }
  .a-line:hover { background: #2E2C29; border-color: #2E2C29; color: #F2F2F0; }
  a:focus-visible { outline: 2px solid #C0392B; outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { a { transition: none; } }
</style>
</head>
<body>
  <div class="box">
    <img src="assets/img/logo.png" alt="Porca Porchetta" width="512" height="512">
    <hr class="rule">
    <p class="n">Errore 404</p>
    <h1>Questa pagina non esiste</h1>
    <p class="lede">Il menù e la prenotazione sì. Torna alla home o vai direttamente al menù.</p>
    <div class="row">
      <a class="a-rosso" href="./">Torna alla home</a>
      <a class="a-line" href="menu.html">Menù</a>
    </div>
  </div>
</body>
</html>
