# Porca Porchetta — static site, no build step.
[build]
  publish = "."
  command = ""

# Security headers. Single global block: stacking multiple matching [[headers]]
# blocks duplicates CSP on Netlify, so everything the site needs lives here.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=()"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; connect-src 'self'; form-action 'none'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'"

# Fingerprint-free assets: cache hard, they are replaced by name on redeploy.
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# /menu is the QR-code target: keep the printed URL short and stable.
[[redirects]]
  from = "/menu"
  to = "/menu.html"
  status = 200

[[redirects]]
  from = "/menu/"
  to = "/menu.html"
  status = 200
