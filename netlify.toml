# Porca Porchetta — static site, no build step.
[build]
  publish = "."
  command = ""

# Security headers. Single global block: stacking multiple matching [[headers]]
# blocks duplicates CSP on Netlify, so everything the site needs lives here.
#
# connect-src carries the Supabase project because prenota.html calls three
# Edge Functions there (porca-availability / porca-book / porca-cancel). With
# 'self' alone the booking widget would fail silently on the first fetch.
#
# form-action is 'self', not 'none': the booking form is submitted by JS, but a
# CSP that forbids every form destination breaks the no-JavaScript path and any
# future plain <form> on the site. 'self' still blocks exfiltration off-origin.
#
# frame-src names www.google.com for the map embed on index.html. Without it the
# directive falls back to default-src 'self' and the map is blocked — the iframe
# renders as an empty box with a console error and nothing else.
#
# script-src and style-src stay at 'self' with no 'unsafe-inline'. That is load
# bearing, not tidiness: prenota.html collects name, email, phone and consent, so
# an inline-script escape hatch there is worth more to an attacker than anywhere
# else on the site. It is also why the booking config lives in
# js/booking-config.js rather than in an inline <script> — with 'unsafe-inline'
# absent, an inline config block is silently dropped, window.PORCA_BOOKING_CONFIG
# never exists, and booking.js falls back to the phone-only card. That failure is
# indistinguishable from a deliberate suspension, so nobody notices it.
#
# Turnstile is deliberately OFF: the site makes no third-party request at all and
# the CSP says so. The rate limiter in porca-book (5/hour, 20/24h per IP) is the
# protection. Switching Turnstile on means adding https://challenges.cloudflare.com
# to BOTH script-src and frame-src, loading the script in prenota.html, and
# setting turnstileSiteKey — porca-book is fail-closed on an empty token, so
# setting TURNSTILE_SECRET on its own refuses every booking.
# ============================================================================
# BLOCKER FOR THE NETLIFY MIGRATION — READ BEFORE THE FIRST DEPLOY
#
# This file is not in force today. The site is served from GitHub Pages, which
# sends no CSP, so nothing below is currently applied and nothing below has
# ever been exercised against a real deploy.
#
# The day this moves to Netlify (i.e. once the owner buys the domain and we
# host it), `script-src 'self'; style-src 'self'` WILL BREAK admin.html. The
# staff console is deliberately self-contained: its stylesheet is one inline
# <style> block and its whole application is one inline <script>. Both are
# dropped under this policy and the console renders as a blank page. The
# public pages are unaffected — they load css/style.css and js/*.js as files.
#
# Two ways out, in order of preference:
#   1. Extract admin.html's <style> to css/admin.css and its <script> to
#      js/admin.js, and link them. Keeps the policy intact everywhere.
#      Roughly an hour, and it is the honest fix.
#   2. Add a [[headers]] block for "/admin.html" that repeats this CSP with
#      'unsafe-inline' added to script-src and style-src. Five minutes, and it
#      weakens exactly the page that manages the bookings. The page holds no
#      authority (porca-admin verifies the JWT server-side) and renders every
#      untrusted value as a text node, so the real risk is low — but it is a
#      deliberate downgrade and it needs to be a decision, not an accident.
#
# Do not deploy to Netlify without picking one and testing the console login.
# ============================================================================
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=()"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; connect-src 'self' https://wednfenmftdlywrglhgj.supabase.co; frame-src https://www.google.com; form-action 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'"

# Fingerprint-free assets: cache hard, they are replaced by name on redeploy.
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# /menu is the QR-code target: keep the printed URL short and stable.
[[redirects]]
  from = "/menu"
  to = "/menu.html"
  status = 200

[[redirects]]
  from = "/menu/"
  to = "/menu.html"
  status = 200

# /prenota is the short link we hand out by phone and print on the card.
[[redirects]]
  from = "/prenota"
  to = "/prenota.html"
  status = 200

[[redirects]]
  from = "/prenota/"
  to = "/prenota.html"
  status = 200
